# Render Blueprint — HarvestWise (Paytm × Build for India, Track 1)
# Connect this repo in Render and choose "Blueprint" to provision the service.
services:
  - type: web
    name: harvestwise
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      # Required — sign up at https://www.sarvam.ai to get a key.
      - key: SARVAM_API_KEY
        sync: false
      # Optional overrides (defaults already live in server.js):
      - key: SARVAM_CHAT_MODEL
        value: sarvam-105b-conversations
      - key: SARVAM_TTS_MODEL
        value: bulbul:v3
      - key: SARVAM_TTS_SPEAKER
        value: anushka
      - key: SARVAM_STT_MODEL
        value: saaras:v4
      # Optional Cognee memory service (leave unset to run without it).
      - key: COGNEE_BASE_URL
        sync: false
      - key: COGNEE_API_KEY
        sync: false
      - key: COGNEE_DATASET
        value: harvestwise
